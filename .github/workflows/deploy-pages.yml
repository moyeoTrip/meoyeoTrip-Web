name: Deploy Mobile Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile web
        run: npm run lint

      - name: Create runtime authentication config
        env:
          API_BASE_URL: ${{ vars.MOYEO_API_BASE_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: moyeotrip-web@${{ github.sha }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ vars.FIREBASE_WEB_VAPID_KEY }}
          KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          KAKAO_REDIRECT_URI: ${{ vars.KAKAO_REDIRECT_URI }}
        run: >-
          node -e 'const fs=require("fs"); const e=process.env; const config={apiBaseUrl:e.API_BASE_URL||"https://moyeo-trip-api.jayden-bin.cc",firebase:{apiKey:e.FIREBASE_WEB_API_KEY,authDomain:e.FIREBASE_AUTH_DOMAIN,projectId:e.FIREBASE_PROJECT_ID,storageBucket:e.FIREBASE_STORAGE_BUCKET,messagingSenderId:e.FIREBASE_MESSAGING_SENDER_ID,appId:e.FIREBASE_WEB_APP_ID},firebaseVapidKey:e.FIREBASE_WEB_VAPID_KEY||"",kakaoJavaScriptKey:e.KAKAO_JAVASCRIPT_KEY,kakaoRedirectUri:e.KAKAO_REDIRECT_URI,sentry:{dsn:e.SENTRY_DSN||"",environment:e.SENTRY_ENVIRONMENT||"production",release:e.SENTRY_RELEASE||"",tracesSampleRate:Number(e.SENTRY_TRACES_SAMPLE_RATE||0)}}; fs.writeFileSync("src/runtime-config.js",`window.MOYEO_RUNTIME_CONFIG = ${JSON.stringify(config)};\n`);'

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
